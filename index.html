<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostureGuard Camera</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, "Noto Sans Thai", sans-serif;
      background:#f5f1ef;
      color:#3f302c;
    }
    .wrap{max-width:920px;margin:auto;padding:20px}
    h1{margin:0 0 6px;font-size:30px}
    .sub{color:#7b6c66;margin:0 0 18px}
    .card{
      background:#fff;
      border-radius:22px;
      padding:18px;
      box-shadow:0 8px 24px rgba(70,50,40,.08);
      border:1px solid #eadfda;
    }
    .cameraBox{
      position:relative;
      background:#111;
      border-radius:18px;
      overflow:hidden;
      aspect-ratio:16/10;
    }
    #video{
      width:100%;height:100%;object-fit:cover;
      transform:scaleX(-1);
    }
    #canvas{
      position:absolute;left:0;top:0;width:100%;height:100%;
      transform:scaleX(-1);
    }
    .status{
      position:absolute;top:12px;left:12px;
      background:rgba(0,0,0,.65);color:#fff;
      padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;
    }
    .info{
      margin-top:14px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
    }
    .label{font-size:13px;color:#84736c}
    .big{font-size:30px;font-weight:800}
    .good{color:#2f8f68}
    .bad{color:#b24f4b}
    .bar{
      height:12px;background:#eee6e2;border-radius:999px;
      overflow:hidden;margin-top:8px;
    }
    #barFill{
      height:100%;width:0;background:#2f8f68;border-radius:999px;
      transition:width .25s;
    }
    .reason{
      margin-top:12px;padding:12px;
      background:#fff4e9;border-radius:14px;
      font-size:14px;
    }
    .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    button{
      border:0;border-radius:12px;padding:12px 18px;
      font-weight:800;cursor:pointer;
    }
    #startBtn{background:#2f8f68;color:white}
    #stopBtn{background:#b24f4b;color:white}
    #stopBtn:disabled,#startBtn:disabled{opacity:.55;cursor:not-allowed}
    .note{
      margin-top:14px;font-size:12px;color:#796c65;
      line-height:1.5
    }
    @media(max-width:600px){
      .wrap{padding:12px}
      h1{font-size:24px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>PostureGuard Camera</h1>
      <p class="sub">ตรวจจับท่านั่งแบบเรียลไทม์</p>

      <div class="cameraBox">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="status" id="cameraStatus">ยังไม่เปิดกล้อง</div>
      </div>

      <div class="info">
        <div>
          <div class="label">สถานะท่านั่ง</div>
          <div class="big good" id="postureText">พร้อมตรวจ</div>
        </div>
        <div style="text-align:right">
          <div class="label">คะแนน</div>
          <div class="big" id="score">—</div>
        </div>
      </div>

      <div style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span>คุณภาพท่านั่ง</span>
          <strong id="scoreLabel">ยังไม่มีข้อมูล</strong>
        </div>
        <div class="bar"><div id="barFill"></div></div>
      </div>

      <div class="reason" id="reason">กด “เชื่อมต่อกล้อง” แล้วนั่งให้เห็นศีรษะ ไหล่ และสะโพก</div>

      <div class="actions">
        <button id="startBtn" onclick="startCamera()">เชื่อมต่อกล้อง</button>
        <button id="stopBtn" onclick="stopCamera()" disabled>หยุดกล้อง</button>
      </div>

      <div class="note">
        ระบบนี้เป็นต้นแบบสำหรับโครงงานและช่วยสังเกตท่านั่งเบื้องต้น ไม่ใช่อุปกรณ์วินิจฉัยทางการแพทย์
      </div>
    </div>
  </div>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const cameraStatus = document.getElementById('cameraStatus');
  const postureText = document.getElementById('postureText');
  const scoreEl = document.getElementById('score');
  const scoreLabel = document.getElementById('scoreLabel');
  const barFill = document.getElementById('barFill');
  const reasonEl = document.getElementById('reason');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');

  let stream = null;
  let running = false;
  let pose = null;

  function dist(a,b){
    return Math.hypot(a.x-b.x, a.y-b.y);
  }

  function avg(a,b){
    return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  }

  function angleFromVertical(a,b){
    const dx=b.x-a.x, dy=b.y-a.y;
    return Math.abs(Math.atan2(dx,-dy)*180/Math.PI);
  }

  function evaluate(lm){
    const nose=lm[0], ls=lm[11], rs=lm[12], lh=lm[23], rh=lm[24];
    if(!nose||!ls||!rs||!lh||!rh) {
      return {valid:false};
    }

    const shoulder=avg(ls,rs);
    const hip=avg(lh,rh);
    const torso=Math.max(.05,dist(shoulder,hip));

    const headForward=Math.abs(nose.x-shoulder.x)/torso;
    const shoulderTilt=angleFromVertical(
      {x:ls.x,y:ls.y},
      {x:rs.x,y:rs.y}
    );
    const torsoLean=angleFromVertical(hip,shoulder);

    let score=100;
    const reasons=[];

    if(headForward>.24){score-=35;reasons.push("ศีรษะโน้มไปด้านหน้ามาก");}
    else if(headForward>.18){score-=18;reasons.push("จัดศีรษะให้อยู่เหนือแนวลำตัว");}

    if(shoulderTilt>15){score-=25;reasons.push("ไหล่เอียง");}
    else if(shoulderTilt>9){score-=12;reasons.push("ปรับระดับไหล่ให้สมดุล");}

    if(torsoLean>18){score-=30;reasons.push("ลำตัวเอนมาก");}
    else if(torsoLean>12){score-=15;reasons.push("ลองนั่งให้ลำตัวตั้งตรงขึ้น");}

    score=Math.max(0,Math.min(100,Math.round(score)));

    return {
      valid:true,
      score,
      good:score>=78,
      reason:reasons.length?reasons.join(" • "):"ท่านั่งอยู่ในเกณฑ์ดี"
    };
  }

  function showResult(r){
    if(!r.valid){
      postureText.textContent="ไม่พบท่าครบ";
      postureText.className="big bad";
      scoreEl.textContent="—";
      scoreLabel.textContent="ปรับตำแหน่งกล้อง";
      barFill.style.width="0%";
      reasonEl.textContent="ขยับให้เห็นศีรษะ ไหล่ และสะโพก";
      return;
    }

    scoreEl.textContent=r.score;
    barFill.style.width=r.score+"%";
    scoreLabel.textContent=r.good?"ดี":"ควรปรับ";

    if(r.good){
      postureText.textContent="ท่านั่งเหมาะสม";
      postureText.className="big good";
      reasonEl.textContent=r.reason;
    }else{
      postureText.textContent="ควรปรับท่านั่ง";
      postureText.className="big bad";
      reasonEl.textContent=r.reason;
    }
  }

  async function setupPose(){
    pose = new Pose({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity:1,
      smoothLandmarks:true,
      enableSegmentation:false,
      minDetectionConfidence:.55,
      minTrackingConfidence:.55
    });

    pose.onResults(results=>{
      if(!running)return;

      canvas.width=video.videoWidth||640;
      canvas.height=video.videoHeight||400;
      ctx.clearRect(0,0,canvas.width,canvas.height);

      if(!results.poseLandmarks){
        cameraStatus.textContent="ไม่พบคนในภาพ";
        showResult({valid:false});
        return;
      }

      cameraStatus.textContent="กำลังตรวจจับ";

      try{
        drawConnectors(ctx,results.poseLandmarks,POSE_CONNECTIONS,{
          color:"#77d0a2",lineWidth:3
        });
        drawLandmarks(ctx,results.poseLandmarks,{
          color:"#ffffff",lineWidth:1,radius:3
        });
      }catch(e){}

      showResult(evaluate(results.poseLandmarks));
    });

    async function loop(){
      if(!running)return;
      if(video.readyState>=2){
        try{await pose.send({image:video});}catch(e){}
      }
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  }

  async function startCamera(){
    if(running)return;

    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:false
      });

      video.srcObject=stream;
      running=true;
      startBtn.disabled=true;
      stopBtn.disabled=false;
      cameraStatus.textContent="กำลังเปิดกล้อง";

      await setupPose();
    }catch(e){
      cameraStatus.textContent="เปิดกล้องไม่สำเร็จ";
      reasonEl.textContent="กรุณากด Allow/อนุญาต Camera และเปิดหน้านี้ผ่าน HTTPS";
    }
  }

  function stopCamera(){
    running=false;

    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream=null;
    }

    video.srcObject=null;
    startBtn.disabled=false;
    stopBtn.disabled=true;
    cameraStatus.textContent="หยุดกล้องแล้ว";
    postureText.textContent="พร้อมตรวจ";
    postureText.className="big good";
    scoreEl.textContent="—";
    scoreLabel.textContent="ยังไม่มีข้อมูล";
    barFill.style.width="0%";
    reasonEl.textContent="กด “เชื่อมต่อกล้อง” เพื่อเริ่มตรวจ";
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
</script>
</body>
</html>
